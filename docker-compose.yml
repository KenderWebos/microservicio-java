version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: dockerfile-local  # Cambia a dockerfile para ARM
    ports:
      - "9090:9090"
    environment:
      - MYSQL_URL=jdbc:mysql://db:3306/usersdb
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=rootpassword
    depends_on:
      - db
  
  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=usersdb
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: 