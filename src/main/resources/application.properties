spring.application.name=java-api

# Configuración de la base de datos con variables de entorno
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/HTDB}
spring.datasource.username=${MYSQL_USERNAME:admin}
spring.datasource.password=${MYSQL_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update

# Configuración explícita del dialecto
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración de conexión
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# Mostrar consultas SQL en logs
spring.jpa.show-sql=true

server.port=9090